# Docker daemon chạy trong sidecar đặc quyền; Jenkins chỉ giao tiếp với daemon qua TLS.
services:
  docker:
    image: docker:29-dind
    privileged: true
    command: ["--storage-driver=overlay2"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs-client:/certs/client
      - jenkins-data:/var/jenkins_home
    networks:
      default:
        aliases:
          - docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  jenkins:
    image: yamiannephilim/jenkins:latest
    build:
      context: .
      args:
        JENKINS_VERSION: 2.555.3-jdk21
    depends_on:
      docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - docker-certs-client:/certs/client:ro
      - jenkins-data:/var/jenkins_home
    restart: unless-stopped

# Volume chứng thư được chia sẻ ở chế độ chỉ đọc cho Jenkins; dữ liệu Jenkins tồn tại qua lần chạy.
volumes:
  docker-certs-client:
  jenkins-data:

# Tóm tắt: Compose khởi động daemon trước, chờ healthy rồi mới đưa Jenkins vào hoạt động.
